<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสร้างรายงานผลการปฏิบัติงาน - Infographic Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    
    :root {
      --bg-gradient-start: #0f4c81;
      --bg-gradient-end: #062846;
      --gold-primary: #d4af37;
      --gold-secondary: #f3e5ab;
      --card-bg: rgba(8, 32, 58, 0.85);
      --card-border: #d4af37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
    body { background-color: #1a1a1a; color: #333; padding: 20px; }

    .app-container { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; }
    .form-panel { flex: 1; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
    .preview-panel { flex: 1.2; display: flex; flex-direction: column; align-items: center; }

    .form-group { margin-bottom: 18px; }
    label { font-weight: 700; display: block; margin-bottom: 6px; color: #0f4c81; font-size: 14px; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: #0f4c81; color: white; }
    .btn-primary:hover { background: #0a355c; }
    .btn-success { background: #2e7d32; color: white; font-size: 16px; padding: 12px 24px; width: 100%; margin-top: 10px; }
    .btn-success:hover { background: #1b5e20; }
    .btn-danger { background: #c62828; color: white; padding: 6px 12px; font-size: 12px; }
    .btn-add { background: #0288d1; color: white; padding: 8px 14px; font-size: 13px; margin-top: 5px; }

    /* Canvas Preview Box */
    #infographic-canvas {
      width: 794px;
      min-height: 1123px;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      background-size: cover;
      background-position: center;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 35, 60, 0.4);
      z-index: 1; pointer-events: none;
    }

    .canvas-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }

    .header-box { text-align: center; border-bottom: 2px solid var(--gold-primary); padding-bottom: 15px; margin-bottom: 20px; }
    
    /* Logo Box */
    .logo-container { margin-bottom: 10px; display: flex; justify-content: center; align-items: center; }
    .logo-img { height: 80px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .logo-img.circle { border-radius: 50%; border: 2px solid var(--gold-primary); }

    .header-title { font-size: 26px; font-weight: 700; color: var(--gold-secondary); text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    .month-badge { display: inline-block; background: linear-gradient(90deg, #d4af37, #f3e5ab, #d4af37); color: #000; font-weight: 700; padding: 4px 20px; border-radius: 20px; margin-top: 8px; font-size: 16px; }

    .photo-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .photo-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .photo-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .photo-grid-4 { grid-template-columns: repeat(4, 1fr); }
    
    .photo-card { border: 2px solid var(--gold-primary); border-radius: 8px; overflow: hidden; background: #000; height: 160px; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; }

    .task-section { background: var(--card-bg); border: 2px solid var(--gold-primary); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 700; color: var(--gold-secondary); border-bottom: 1px solid var(--gold-primary); padding-bottom: 6px; margin-bottom: 12px; }

    .area-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .area-box { background: rgba(255,255,255,0.08); border-left: 4px solid var(--gold-primary); padding: 10px; border-radius: 4px; }
    .area-name { font-weight: 700; color: var(--gold-secondary); font-size: 15px; margin-bottom: 5px; }
    .task-list { list-style: none; font-size: 13px; line-height: 1.5; }
    .task-list li::before { content: "• "; color: var(--gold-primary); }

    .staff-section { background: var(--card-bg); border: 2px solid var(--gold-primary); border-radius: 10px; padding: 12px 15px; }
    .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
    .staff-card { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(212,175,55,0.4); text-align: center; }
    .staff-name { font-weight: 700; color: #fff; font-size: 14px; }
    .staff-role { font-size: 12px; color: var(--gold-secondary); }

    .staff-input-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- FORM PANEL -->
  <div class="form-panel">
    <h2 style="color:#0f4c81; margin-bottom:15px; border-bottom:2px solid #0f4c81; padding-bottom:5px;">📝 ฟอร์มกรอกข้อมูลรายงาน</h2>
    
    <div class="form-group" style="background:#e3f2fd; padding:12px; border-radius:8px; border:1px solid #90caf9;">
      <label style="color:#0d47a1;">📌 1. อัปโหลดโลโก้หน่วยงาน</label>
      <input type="file" id="inputLogo" accept="image/*" onchange="handleLogoUpload(this)">
      <div style="margin-top:6px;">
        <label style="font-weight:normal; font-size:13px; cursor:pointer;">
          <input type="checkbox" id="logoCircle" onchange="updateView()"> ใส่กรอบวงกลมขอบทอง
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>2. ข้อความส่วนหัว / ชื่อหน่วยงาน</label>
      <input type="text" id="inputAgency" value="ฝ่ายเครื่องจักรกล กองช่าง อบจ.สุพรรณบุรี" oninput="updateView()">
    </div>
    
    <div class="form-group">
      <label>3. หัวข้อรายงาน / ประจำเดือน</label>
      <input type="text" id="inputTitle" value="สรุปผลการปฏิบัติงาน ประจำวันที่ 8 ตุลาคม 2569" oninput="updateView()">
    </div>

    <div class="form-group" style="background:#f5f5f5; padding:12px; border-radius:8px;">
      <label>4. รายชื่อผู้ปฏิบัติงาน (เพิ่มได้หลายคน)</label>
      <div id="staffInputsContainer"></div>
      <button class="btn btn-add" onclick="addStaffInput()">+ เพิ่มผู้ปฏิบัติงาน</button>
    </div>

    <div class="form-group">
      <label>5. อัปโหลดรูปภาพผลงาน (เลือกได้หลายรูป)</label>
      <input type="file" id="inputPhotos" multiple accept="image/*" onchange="handlePhotos(this)">
      <div style="margin-top:8px;">
        <label style="font-weight:normal;">จำนวนคอลัมน์แสดงรูปภาพ:</label>
        <select id="gridCols" onchange="updateView()">
          <option value="2">2 คอลัมน์</option>
          <option value="3" selected>3 คอลัมน์</option>
          <option value="4">4 คอลัมน์</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>6. ภารกิจแยกตามพื้นที่/อำเภอ</label>
      <div id="areaInputsContainer"></div>
      <button class="btn btn-add" onclick="addAreaInput()">+ เพิ่มพื้นที่/หน่วยงาน</button>
    </div>

    <div style="margin-top:25px; text-align:center;">
      <button class="btn btn-success" onclick="downloadPNG()">📸 ดาวน์โหลดเป็นรูปภาพ (PNG)</button>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div id="infographic-canvas">
      <div class="bg-overlay"></div>
      <div class="canvas-content">
        <div>
          <div class="header-box">
            <div class="logo-container" id="logoContainer">
              <svg class="logo-img" viewBox="0 0 100 100" style="width:75px; height:75px;">
                <circle cx="50" cy="50" r="45" fill="#d4af37" stroke="#ffffff" stroke-width="3"/>
                <path d="M50 20 L60 40 L80 40 L65 55 L72 75 L50 62 L28 75 L35 55 L20 40 L40 40 Z" fill="#0f4c81"/>
              </svg>
            </div>
            <div class="header-title" id="viewAgency">ฝ่ายเครื่องจักรกล กองช่าง อบจ.สุพรรณบุรี</div>
            <div class="month-badge" id="viewTitle">สรุปผลการปฏิบัติงาน ประจำวันที่ 8 ตุลาคม 2569</div>
          </div>

          <div class="photo-grid photo-grid-3" id="viewPhotoGrid">
            <div class="photo-card"><img src="https://via.placeholder.com/300x200/0f4c81/ffffff?text=Sample+Photo+1"></div>
            <div class="photo-card"><img src="https://via.placeholder.com/300x200/0f4c81/ffffff?text=Sample+Photo+2"></div>
            <div class="photo-card"><img src="https://via.placeholder.com/300x200/0f4c81/ffffff?text=Sample+Photo+3"></div>
          </div>

          <div class="task-section">
            <div class="section-title">📍 การดำเนินงานสรุปตามพื้นที่ปฏิบัติงาน</div>
            <div class="area-grid" id="viewAreaGrid"></div>
          </div>
        </div>

        <div class="staff-section">
          <div class="section-title" style="font-size:15px; margin-bottom:6px;">👷‍♂️ ผู้ปฏิบัติงาน / เจ้าหน้าที่รับผิดชอบ</div>
          <div class="staff-grid" id="viewStaffGrid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let logoDataUrl = "";
  let staffList = [
    { name: "นายสมชาย ใจดี", role: "พนักงานขับเครื่องจักรกล" },
    { name: "นายวิชัย รักงาน", role: "นายช่างโยธาปฏิบัติงาน" }
  ];

  let areaList = [
    { name: "อำเภอเมือง", tasks: "ขุดลอกคลองส่งน้ำ\nปรับพื้นที่สาธารณะ" },
    { name: "อำเภอบางปะหัน", tasks: "ขนย้ายเครื่องจักรกลเข้าพื้นที่" }
  ];

  let uploadedPhotos = [];

  function init() {
    renderStaffInputs();
    renderAreaInputs();
    updateView();
  }

  function handleLogoUpload(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        logoDataUrl = e.target.result;
        updateView();
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function renderStaffInputs() {
    const container = document.getElementById('staffInputsContainer');
    container.innerHTML = '';
    staffList.forEach((staff, index) => {
      container.innerHTML += `
        <div class="staff-input-item">
          <input type="text" placeholder="ชื่อ-นามสกุล" value="${staff.name}" oninput="staffList[${index}].name = this.value; updateView();">
          <input type="text" placeholder="ตำแหน่ง" value="${staff.role}" oninput="staffList[${index}].role = this.value; updateView();">
          <button class="btn btn-danger" onclick="removeStaff(${index})">ลบ</button>
        </div>
      `;
    });
  }

  function addStaffInput() {
    staffList.push({ name: "", role: "" });
    renderStaffInputs();
    updateView();
  }

  function removeStaff(index) {
    staffList.splice(index, 1);
    renderStaffInputs();
    updateView();
  }

  function renderAreaInputs() {
    const container = document.getElementById('areaInputsContainer');
    container.innerHTML = '';
    areaList.forEach((area, index) => {
      container.innerHTML += `
        <div style="background:#fff; padding:10px; border-radius:6px; margin-bottom:10px; border:1px solid #ccc;">
          <input type="text" placeholder="ชื่อพื้นที่/อำเภอ" value="${area.name}" oninput="areaList[${index}].name = this.value; updateView();" style="margin-bottom:6px;">
          <textarea placeholder="รายการภารกิจ (ขึ้นบรรทัดใหม่เพื่อแยกข้อ)" oninput="areaList[${index}].tasks = this.value; updateView();">${area.tasks}</textarea>
          <button class="btn btn-danger" onclick="removeArea(${index})" style="margin-top:6px;">ลบพื้นที่นี้</button>
        </div>
      `;
    });
  }

  function addAreaInput() {
    areaList.push({ name: "", tasks: "" });
    renderAreaInputs();
    updateView();
  }

  function removeArea(index) {
    areaList.splice(index, 1);
    renderAreaInputs();
    updateView();
  }

  function handlePhotos(input) {
    if (input.files) {
      uploadedPhotos = [];
      Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedPhotos.push(e.target.result);
          updatePhotosView();
        }
        reader.readAsDataURL(file);
      });
    }
  }

  function updatePhotosView() {
    const grid = document.getElementById('viewPhotoGrid');
    if (uploadedPhotos.length === 0) return;
    grid.innerHTML = '';
    uploadedPhotos.forEach(src => {
      grid.innerHTML += `<div class="photo-card"><img src="${src}"></div>`;
    });
  }

  function updateView() {
    const logoContainer = document.getElementById('logoContainer');
    const isCircle = document.getElementById('logoCircle').checked;
    if (logoDataUrl) {
      logoContainer.innerHTML = `<img src="${logoDataUrl}" class="logo-img ${isCircle ? 'circle' : ''}">`;
    }

    document.getElementById('viewAgency').innerText = document.getElementById('inputAgency').value;
    document.getElementById('viewTitle').innerText = document.getElementById('inputTitle').value;

    const cols = document.getElementById('gridCols').value;
    const photoGrid = document.getElementById('viewPhotoGrid');
    photoGrid.className = `photo-grid photo-grid-${cols}`;

    const staffGrid = document.getElementById('viewStaffGrid');
    staffGrid.innerHTML = '';
    staffList.forEach(s => {
      if(s.name) {
        staffGrid.innerHTML += `
          <div class="staff-card">
            <div class="staff-name">${s.name}</div>
            <div class="staff-role">${s.role || '-'}</div>
          </div>
        `;
      }
    });

    const areaGrid = document.getElementById('viewAreaGrid');
    areaGrid.innerHTML = '';
    areaList.forEach(a => {
      if(a.name) {
        const tasksHtml = a.tasks.split('\n').filter(t => t.trim() !== '').map(t => `<li>${t}</li>`).join('');
        areaGrid.innerHTML += `
          <div class="area-box">
            <div class="area-name">📍 ${a.name}</div>
            <ul class="task-list">${tasksHtml}</ul>
          </div>
        `;
      }
    });
  }

  function downloadPNG() {
    const canvas = document.getElementById('infographic-canvas');
    html2canvas(canvas, { scale: 2 }).then(c => {
      const link = document.createElement('a');
      link.download = 'รายงานผลการปฏิบัติงาน.png';
      link.href = c.toDataURL();
      link.click();
    });
  }

  window.onload = init;
</script>
</body>
</html>
