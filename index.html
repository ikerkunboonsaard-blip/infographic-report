<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสร้างรายงานผลการปฏิบัติงาน - Infographic Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    
    :root {
      --bg-gradient-start: #0f4c81;
      --bg-gradient-end: #062846;
      --gold-primary: #d4af37;
      --gold-secondary: #f3e5ab;
      --card-bg: rgba(8, 32, 58, 0.85);
      --card-border: #d4af37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
    body { background-color: #1a1a1a; color: #333; padding: 20px; }

    .app-container { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; }
    .form-panel { flex: 1; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
    .preview-panel { flex: 1.2; display: flex; flex-direction: column; align-items: center; }

    .form-group { margin-bottom: 18px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: #0f4c81; font-size: 14px; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: #0f4c81; color: white; }
    .btn-primary:hover { background: #0a355c; }
    .btn-success { background: #2e7d32; color: white; font-size: 16px; padding: 12px 24px; width: 100%; margin-top: 10px; }
    .btn-success:hover { background: #1b5e20; }
    .btn-danger { background: #c62828; color: white; padding: 6px 12px; font-size: 12px; }
    .btn-add { background: #0288d1; color: white; padding: 8px 14px; font-size: 13px; margin-top: 5px; }

    /* Canvas Preview Box */
    #infographic-canvas {
      width: 794px;
      min-height: 1123px;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      background-size: cover;
      background-position: center;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 35, 60, 0.4);
      z-index: 1; pointer-events: none;
    }

    .canvas-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }

    .header-box { text-align: center; border-bottom: 2px solid var(--gold-primary); padding-bottom: 15px; margin-bottom: 20px; }
    
    /* Logo Box */
    .logo-container { margin-bottom: 10px; display: flex; justify-content: center; align-items: center; }
    .logo-img { height: 75px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .logo-img.circle { border-radius: 50%; border: 2px solid var(--gold-primary); }

    .header-title { font-size: 26px; font-weight: 700; color: var(--gold-secondary); text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    .month-badge { display: inline-block; background: linear-gradient(90deg, #d4af37, #f3e5ab, #d4af37); color: #000; font-weight: 700; padding: 4px 20px; border-radius: 20px; margin-top: 8px; font-size: 16px; }

    .photo-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .photo-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .photo-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .photo-grid-4 { grid-template-columns: repeat(4, 1fr); }
    
    .photo-card { border: 2px solid var(--gold-primary); border-radius: 8px; overflow: hidden; background: #000; height: 160px; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; }

    .task-section { background: var(--card-bg); border: 2px solid var(--gold-primary); border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 700; color: var(--gold-secondary); border-bottom: 1px solid var(--gold-primary); padding-bottom: 6px; margin-bottom: 12px; }

    .area-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .area-box { background: rgba(255,255,255,0.08); border-left: 4px solid var(--gold-primary); padding: 10px; border-radius: 4px; }
    .area-name { font-weight: 700; color: var(--gold-secondary); font-size: 15px; margin-bottom: 5px; }
    .task-list { list-style: none; font-size: 13px; line-height: 1.5; }
    .task-list li::before { content: "• "; color: var(--gold-primary); }

    .staff-section { background: var(--card-bg); border: 2px solid var(--gold-primary); border-radius: 10px; padding: 12px 15px; }
    .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
    .staff-card { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(212,175,55,0.4); text-align: center; }
    .staff-name { font-weight: 700; color: #fff; font-size: 14px; }
    .staff-role { font-size: 12px; color: var(--gold-secondary); }

    .staff-input-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- FORM PANEL
